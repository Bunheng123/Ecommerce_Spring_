spring.application.name=Stock_Inventory

server.port=9090

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Sizes
#spring.upload-dir=uploads
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.max-file-size=20MB

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:my-super-secret-key-for-jwt-authentication-project-2026}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Optional .env file import
spring.config.import=optional:file:.env[.properties]

# Spring Mail & Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Admin Alert Recipient Email
app.admin.email=${ADMIN_EMAIL:hengheng513.513@gmail.com}
